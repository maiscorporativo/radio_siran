<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conectando Spotify…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #f2f3f5;
      font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
    a { color: #1ed760; }
  </style>
</head>
<body>
  <p id="msg">Conectando ao Spotify…</p>
  <script src="spotify.js"></script>
  <script>
    RSpotify.handleCallback()
      .then((back) => location.replace(back))
      .catch((e) => {
        document.getElementById('msg').innerHTML = `${e.message}<br><br><a href="/player/">Voltar ao player</a>`;
      });
  </script>
</body>
</html>
